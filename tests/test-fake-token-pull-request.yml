name: Test fake token on pull_request event
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/pull/1/merge
      GITHUB_EVENT_NAME: pull_request
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          vercel-token: fake-token-for-testing
          github-comment: 'false'
          github-deployment: 'false'
          target: preview
      - name: Assert action failed due to invalid Vercel token
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with fake token on PR event, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed with fake Vercel token on pull_request event"
