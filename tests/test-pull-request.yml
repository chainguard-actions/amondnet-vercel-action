name: Test pull request event scenario
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create minimal project files
        run: |
          mkdir -p /tmp/vercel-pr-project
          echo '{}' > /tmp/vercel-pr-project/package.json
          echo '<html><body>PR Preview</body></html>' > /tmp/vercel-pr-project/index.html
      - id: action
        uses: .
        continue-on-error: true
        with:
          vercel-token: fake-token-for-testing
          github-comment: 'false'
          target: preview
          working-directory: /tmp/vercel-pr-project
        env:
          GITHUB_EVENT_NAME: pull_request
          GITHUB_REF: refs/pull/1/merge
          GITHUB_HEAD_REF: feature-branch
          GITHUB_BASE_REF: main
      - name: Assert action ran (not skipped)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action ran with outcome=$OUTCOME"
