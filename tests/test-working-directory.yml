name: Test action with working-directory input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a working directory with a simple project
        run: |
          mkdir -p /tmp/test-project
          echo '{"name":"test-project"}' > /tmp/test-project/package.json

      - name: Run action with working-directory set (expect failure at vercel deploy)
        id: action
        uses: .
        with:
          vercel-token: fake-invalid-token-for-testing
          github-comment: 'false'
          working-directory: /tmp/test-project
        continue-on-error: true

      - name: Assert action failed (working-directory was accepted, failed at vercel deploy)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid token, but got: ${{ steps.action.outcome }}"
            exit 1
          fi
          echo "PASS: action correctly accepted working-directory and failed at vercel deploy"
