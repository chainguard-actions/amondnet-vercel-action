name: Test with project name and version inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          vercel-token: fake-token-for-testing
          vercel-project-id: fake-project-id
          vercel-org-id: fake-org-id
          vercel-project-name: my-test-project
          vercel-version: '32.0.0'
          github-comment: 'false'

      - name: Assert action ran with project-name and version inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because the token is invalid (Vercel API rejection).
          # A 'success' would be unexpected with a fake token.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected with invalid token"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action unexpectedly succeeded with a fake token"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
