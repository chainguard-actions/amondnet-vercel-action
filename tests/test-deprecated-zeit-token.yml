name: Test deprecated zeit-token backward compatibility
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create minimal project files
        run: |
          mkdir -p /tmp/vercel-zeit-project
          echo '{}' > /tmp/vercel-zeit-project/package.json
          echo '<html><body>Zeit Legacy</body></html>' > /tmp/vercel-zeit-project/index.html
      - id: action
        uses: .
        continue-on-error: true
        with:
          vercel-token: fake-token-for-testing
          zeit-token: fake-zeit-token
          github-comment: 'false'
          working-directory: /tmp/vercel-zeit-project
        env:
          GITHUB_EVENT_NAME: push
          GITHUB_REF: refs/heads/main
      - name: Assert action ran (not skipped)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action ran with outcome=$OUTCOME"
