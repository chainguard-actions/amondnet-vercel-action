name: Test action with github-comment disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with github-comment disabled (expect failure at vercel deploy)
        id: action
        uses: .
        with:
          vercel-token: fake-invalid-token-for-testing
          github-comment: 'false'
        continue-on-error: true

      - name: Assert action failed at vercel deploy stage (not at github comment stage)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          # With github-comment=false and an invalid token, the action should fail
          # at the vercel deploy step (not at a github comment step)
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail, but got: ${{ steps.action.outcome }}"
            exit 1
          fi
          echo "PASS: action correctly failed at vercel deploy stage"
