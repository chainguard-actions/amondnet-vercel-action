name: Test github-comment disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          vercel-token: invalid-token-for-config-test
          github-comment: 'false'
          target: preview
      - name: Assert action failed at deployment stage
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because of the invalid token (at deployment stage),
          # not because of missing github-token (since github-comment is false).
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (invalid token), but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action failed as expected with github-comment disabled"
