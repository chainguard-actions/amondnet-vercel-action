name: Test basic usage with all inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          vercel-token: fake-vercel-token
          github-token: fake-github-token
          vercel-org-id: fake-org-id
          vercel-project-id: fake-project-id
          vercel-project-name: fake-project-name
          vercel-version: "32.0.0"
          working-directory: .
          scope: fake-scope
          zeit-token: fake-zeit-token
          now-project-id: fake-now-project-id
          now-org-id: fake-now-org-id
          github-comment: "false"
          github-deployment: "false"
          vercel-args: "--prod"
          alias-domains: ""
      - name: Assert action ran (may fail due to fake credentials)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          echo "PASS: action step was reached and executed"
