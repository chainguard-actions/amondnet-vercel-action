name: Test production target configuration
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          vercel-token: invalid-token-for-config-test
          target: production
          github-comment: 'false'
      - name: Assert action failed at deployment (not at config parsing)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because of the invalid token (at deployment stage),
          # not because of invalid config. Either way, outcome should be 'failure'.
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (invalid token), but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action failed as expected (invalid token with production target)"
