name: Test alias-domains input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          vercel-token: fake-invalid-token-for-testing
          github-comment: 'false'
          alias-domains: |
            my-app-{{BRANCH}}.example.com
            my-app.example.com

      - name: Assert action failed gracefully with alias-domains set
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          # The action should fail at the Vercel deployment step (invalid token),
          # not crash due to alias-domains parsing.
          if [ "${{ steps.action.outcome }}" = "cancelled" ]; then
            echo "FAIL: action was unexpectedly cancelled"
            exit 1
          fi
          echo "PASS: action ran with alias-domains input (outcome: ${{ steps.action.outcome }})"
