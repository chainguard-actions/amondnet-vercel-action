name: Test all inputs coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create working directory
        run: mkdir -p /tmp/vercel-test-workdir
      - id: action
        uses: .
        continue-on-error: true
        with:
          vercel-token: fake-vercel-token
          github-token: fake-github-token
          vercel-org-id: fake-org-id
          vercel-project-id: fake-project-id
          vercel-project-name: fake-project-name
          vercel-version: "32.0.0"
          working-directory: /tmp/vercel-test-workdir
          scope: fake-scope
          zeit-token: fake-zeit-token
          now-org-id: fake-now-org-id
          now-project-id: fake-now-project-id
          github-comment: "false"
          github-deployment: "false"
          vercel-args: "--debug"
          alias-domains: ""
          now-args: ""
      - name: Assert action ran (inputs accepted)
        run: |
          echo "Action completed (may have failed due to fake credentials, which is expected)"
          echo "PASS: all inputs were accepted by the action"
