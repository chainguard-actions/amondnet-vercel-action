name: Test invalid target value produces validation error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          vercel-token: invalid-token-for-testing
          github-comment: 'false'
          target: invalid-target-value
      - name: Assert action failed due to invalid target
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid target, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid target value"
