name: Test github-token and scope inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          vercel-token: fake-token-for-testing
          github-token: ${{ github.token }}
          github-comment: 'false'
          scope: my-team-slug
          target: preview
      - name: Assert action failed due to invalid Vercel token
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with fake token, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed with fake Vercel token while github-token and scope inputs were accepted"
