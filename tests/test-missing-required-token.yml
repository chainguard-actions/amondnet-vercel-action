name: Test missing required vercel-token input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          vercel-token: ''
          github-comment: 'false'

      - name: Assert action failed due to missing required token
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action requires vercel-token; providing empty string should fail
          # because core.getInput('vercel-token', { required: true }) throws
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected outcome 'failure' but got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed with missing required token"
