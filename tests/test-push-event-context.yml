name: Test push event context handling
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/feature-branch
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a git commit so git log works
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          git commit --allow-empty -m "test commit for vercel action"

      - id: action
        uses: .
        continue-on-error: true
        with:
          vercel-token: fake-token-push-event-test
          github-comment: 'false'
          vercel-project-id: prj_testproject
          vercel-org-id: team_testorg

      - name: Assert action failed at Vercel deployment (not at git log step)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail at the Vercel CLI deploy step (invalid token),
          # not at the git commit message retrieval step.
          # Either way, outcome should be 'failure'.
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected outcome 'failure' but got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly processed push event context and failed at Vercel deploy"
