name: Test missing vercel-token causes failure
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          github-comment: 'false'
          target: preview
          # vercel-token intentionally omitted (required input)
      - name: Assert action failed due to missing token
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with missing vercel-token, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when vercel-token is missing"
