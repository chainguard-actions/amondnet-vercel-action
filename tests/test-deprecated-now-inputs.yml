name: Test deprecated now-project-id, now-org-id, and scope inputs with invalid token fails gracefully
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          vercel-token: invalid-token-for-testing
          github-comment: 'false'
          now-project-id: prj_fake_now_123
          now-org-id: team_fake_now_123
          scope: my-team-slug
      - name: Assert action failed with deprecated now inputs and invalid token
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid token, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid token when deprecated now-project-id, now-org-id, and scope inputs are set"
