name: Test deprecated zeit/now inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          vercel-token: fake-token-for-testing
          zeit-token: fake-zeit-token-deprecated
          now-project-id: prj_fakenowprojectid
          now-org-id: team_fakenoworgid
          github-comment: 'false'
          target: preview
      - name: Assert action failed due to invalid token
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with fake token, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed with fake tokens while deprecated zeit/now inputs were accepted"
