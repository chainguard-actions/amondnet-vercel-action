name: Test scope and github-token inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          vercel-token: fake-invalid-token-for-testing
          github-comment: 'false'
          github-token: ${{ github.token }}
          scope: fake-team-scope-id
          vercel-project-id: prj_fake123
          vercel-org-id: org_fake456

      - name: Assert action ran (scope and github-token inputs accepted)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          # The action should fail due to invalid Vercel token, not crash on
          # scope or github-token input handling.
          # We just confirm it did not get cancelled unexpectedly.
          if [ "${{ steps.action.outcome }}" = "cancelled" ]; then
            echo "FAIL: action was unexpectedly cancelled"
            exit 1
          fi
          echo "PASS: action ran to completion with scope and github-token inputs (outcome: ${{ steps.action.outcome }})"
