name: Test action with vercel-args and vercel-project-name inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with vercel-args and vercel-project-name (expect failure at vercel deploy)
        id: action
        uses: .
        with:
          vercel-token: fake-invalid-token-for-testing
          github-comment: 'false'
          vercel-args: '--prod'
          vercel-project-name: my-test-project
          vercel-project-id: prj_fakeid123
          vercel-org-id: team_fakeid123
        continue-on-error: true

      - name: Assert action failed at vercel deploy (inputs were accepted)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid token, but got: ${{ steps.action.outcome }}"
            exit 1
          fi
          echo "PASS: action correctly accepted vercel-args and vercel-project-name, failed at vercel deploy"
